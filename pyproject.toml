[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myagent"
version = "0.1.0"
description = "An OpenAI Responses API agent loop with local shell and file tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "croniter>=6.2.4,<7",
    "customtkinter>=6,<7",
    "mcp>=2,<3",
    "openai>=1.66.0,<3",
]

[project.scripts]
myagent = "myagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
